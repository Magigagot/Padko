<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Бокс-тренер</title>
<style>
:root{--bg:#0b0d12;--panel:#161a23;--red:#ff3b4a;--blue:#2f8cff;--tx:#eef1f6;--mut:#8b93a5;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px));background:rgba(11,13,18,.95);text-align:center;overflow:auto}
.hide{display:none!important}
h1{margin:0;font-size:34px;letter-spacing:2px}
h1 span{color:var(--red)}h1 b{color:var(--blue)}
p{margin:0;color:var(--mut);font-size:14px;max-width:420px;line-height:1.45}
#err{color:#ffb020}
button{font:inherit;font-weight:700;font-size:18px;color:var(--tx);background:var(--panel);border:2px solid #2a3040;border-radius:14px;padding:14px 20px;width:min(100%,360px);touch-action:manipulation}
button small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:3px}
button.pri{background:var(--red);border-color:var(--red)}
button:disabled{opacity:.5}
.seg{display:flex;gap:8px;width:min(100%,360px)}
.seg button{flex:1;width:auto;padding:10px 4px;font-size:14px}
.seg button.on{background:var(--blue);border-color:var(--blue)}
#stop{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);width:auto;padding:8px 16px;font-size:14px;z-index:2}
.grade{font-size:80px;font-weight:800;line-height:1}
.grade em{font-style:normal;font-size:28px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,360px)}
.grid div{background:var(--panel);border-radius:12px;padding:10px}
.grid b{display:block;font-size:22px}
.grid i{font-style:normal;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="stop" class="hide">Стоп</button>
<div id="menu" class="scr">
  <h1><span>БОКС</span> <b>ТРЕНЕР</b></h1>
  <p>Включится фронтальная камера. Поставь телефон на 1–1,5 м, чтобы были видны голова, плечи и руки. Красная мишень — бей правой рукой, синяя — левой. Джеб — прямо в мишень, кросс/хук — по мишени в сторону стрелки, апперкот — снизу вверх. Уклоны делай корпусом и головой.</p>
  <div class="seg">
    <button data-d="0">Новичок</button><button data-d="1" class="on">Средний</button><button data-d="2">Профи</button>
  </div>
  <p id="err"></p>
  <button class="pri" data-m="inf">Бесконечный режим<small>Темп растёт, 5 жизней, «Стоп» в любой момент</small></button>
  <button data-m="assess">Оценка навыков · 30 с<small>Удары и защита вперемешку, оценка из 10</small></button>
  <button data-m="def">Уклоны · бесконечный<small>Атаки в лицо, корпус и с боков, 5 жизней</small></button>
</div>
<div id="res" class="scr hide"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),x=cv.getContext('2d');
let W,H,SAT=0;
function rs(){
  const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);
  const pr=document.createElement('div');pr.style.cssText='position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden';
  document.body.appendChild(pr);SAT=pr.offsetHeight;pr.remove();
}
addEventListener('resize',rs);rs();

const COL={R:'#ff3b4a',L:'#2f8cff'};
const NAME={jab:'ДЖЕБ',cross:'КРОСС / ХУК',up:'АППЕРКОТ'};
const DIF=[{n:'Новичок',ttl:1.6,gap:1.4,w:2,thr:.35},{n:'Средний',ttl:1,gap:1,w:3,thr:.45},{n:'Профессионал',ttl:.6,gap:.8,w:3,thr:.55}];
let G=null,runId=0,D=1,lm=null,cam=null;

function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.add('hide'));if(id)$(id).classList.remove('hide')}
function bind(){
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m));
  document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{closeCam();show('menu')});
}
bind();
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{D=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(e=>e.classList.toggle('on',e===b))});

// ---------- камера и поза ----------
const T=(p,n)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('завис: '+n)),30000))]);
async function openCam(){
  const s=await T(navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false}),'камера');
  const v=document.createElement('video');
  v.setAttribute('playsinline','');v.muted=true;v.srcObject=s;
  v.style.cssText='position:fixed;width:2px;height:2px;opacity:0;pointer-events:none';
  document.body.appendChild(v);
  await v.play();
  if(!v.videoWidth)await new Promise(r=>{v.onloadedmetadata=r});
  cam={s,v,lastT:-1,P:null,sm:{},tr:{R:[],L:[]},hp:{R:null,L:null}};
}
function closeCam(){if(!cam)return;cam.s.getTracks().forEach(t=>t.stop());cam.v.remove();cam=null}
async function loadPose(){
  const B='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const M=await T(import(B+'/vision_bundle.mjs'),'движок');
  const f=await T(M.FilesetResolver.forVisionTasks(B+'/wasm'),'wasm');
  lm=await T(M.PoseLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'CPU'},runningMode:'VIDEO',numPoses:1}),'модель');
}
function geo(){const v=cam.v,s=Math.max(W/v.videoWidth,H/v.videoHeight);return{s,ox:(W-v.videoWidth*s)/2,oy:(H-v.videoHeight*s)/2}}
function map(q){const g=geo(),v=cam.v;return{x:(1-q.x)*v.videoWidth*g.s+g.ox,y:q.y*v.videoHeight*g.s+g.oy}}
const IDX=[0,11,12,13,14,15,16,19,20];
function poseUpdate(now){
  const v=cam.v;
  if(v.readyState<2||v.currentTime===cam.lastT)return;
  cam.lastT=v.currentTime;
  const r=lm.detectForVideo(v,performance.now());
  const P=r.landmarks&&r.landmarks[0];
  for(const i of IDX){
    const q=P&&P[i];
    if(q&&q.visibility>.45){const p=map(q),o=cam.sm[i];cam.sm[i]=o?{x:o.x+(p.x-o.x)*.65,y:o.y+(p.y-o.y)*.65}:p}
    else cam.sm[i]=null;
  }
  for(const [h,w,t] of [['R',16,20],['L',15,19]]){
    const a=cam.sm[w],b=cam.sm[t],p=a&&b?{x:(a.x+b.x)/2,y:(a.y+b.y)/2}:(a||b),tr=cam.tr[h];
    if(p){tr.push({x:p.x,y:p.y,t:now});while(tr.length&&now-tr[0].t>260)tr.shift();cam.hp[h]=p}
    else{cam.hp[h]=null;tr.length=0}
  }
}
function swPx(){const a=cam.sm[11],b=cam.sm[12];return a&&b?Math.max(60,Math.hypot(a.x-b.x,a.y-b.y)):W*.3}
function chestPt(sw){const a=cam.sm[11],b=cam.sm[12],n=cam.sm[0];return a&&b?{x:(a.x+b.x)/2,y:(a.y+b.y)/2+sw*.45}:{x:n.x,y:n.y+sw*1.2}}

function camDetect(now){
  poseUpdate(now);
  if(!G.ready){
    const s=cam.sm;
    if(s[0]&&s[11]&&s[12]&&s[15]&&s[16]){if(!G.seen)G.seen=now;if(now-G.seen>400){G.ready=true;G.t0=now;G.next=now+2600}}else G.seen=0;
    return;
  }
  if(now-G.t0<2200)return;
  for(const t of G.tg.slice()){
    const p=cam.hp[t.hand];if(!p||now<t.born)continue;
    if(Math.hypot(p.x-t.x,p.y-t.y)>=t.r*1.3){t.out=1;continue}
    if(!t.out)continue;
    const o=cam.tr[t.hand][0],dx=p.x-o.x,dy=p.y-o.y,m=Math.hypot(dx,dy);
    let ok=null;
    if(t.tp==='jab')ok=true;
    else if(m>t.r*.5)ok=t.tp==='up'?-dy>m*.6:(t.d==='r'?dx:-dx)>m*.6;
    if(ok!==null)act({tg:t},ok?(t.tp==='jab'?'tap':t.tp==='up'?'u':t.d):'x',now);
  }
  const h=G.th[0],n=cam.sm[0];
  if(h&&n){
    const sw=swPx(),th=DIF[D].thr;
    if(h.s==='F'||h.s==='C'){
      const p=h.s==='F'?n:chestPt(sw);
      if(Math.hypot(p.x-h.px,p.y-h.py)>th*sw){G.th.shift();good(h.px,h.py,'УВЕРНУЛСЯ!','#3ddc84',now,now-h.born)}
    }else if(h.n0){
      const dx=(n.x-h.n0.x)/sw,dy=(n.y-h.n0.y)/sw;
      if(Math.max(Math.abs(dx),dy)>th*.8){const a=Math.abs(dx)>dy?(dx<0?'l':'r'):'d';h.n0={x:n.x,y:n.y};act({tg:null},a,now)}
    }
  }
}

// ---------- игра ----------
function makeBag(a){let q=[],last=null;return()=>{if(!q.length){q=a.slice().sort(()=>Math.random()-.5);if(q.length>1&&q[q.length-1]===last)q.unshift(q.pop())}return last=q.pop()}}
async function start(m){
  const err=$('err');err.textContent='';
  const bts=document.querySelectorAll('button');bts.forEach(b=>b.disabled=true);
  let useCam=false;
  try{
    if(!cam){err.textContent='Включаю камеру…';await openCam()}
    if(!lm){err.textContent='Загружаю модель позы (до 30 с)…';await loadPose()}
    useCam=true;err.textContent='';cam.tr.R.length=cam.tr.L.length=0;
  }catch(e){err.textContent='Камера или модель недоступна ('+e.message+') — управление касаниями.';closeCam()}
  bts.forEach(b=>b.disabled=false);
  const now=performance.now();
  G={mode:m,cam:useCam,t0:now,end:30000,tg:[],th:[],fx:[],busy:false,kind:'p',ready:!useCam,seen:0,next:useCam?Infinity:now+700,hit:0,miss:0,wrong:0,rt:[],hR:0,hL:0,lives:5,combo:0,best:0,score:0,fl:{u:0,c:''},dif:D,
    bt:makeBag(['R','L'].flatMap(h=>['jab','up','l','r'].map(k=>h+':'+k))),bh:makeBag(useCam?['L','R','D','F','C']:['L','R','D'])};
  show(null);$('stop').classList.toggle('hide',m==='assess');
  const id=++runId;requestAnimationFrame(t=>tick(t,id));
}
function finish(){if(!G)return;const g=G;G=null;runId++;$('stop').classList.add('hide');result(g)}
$('stop').onclick=finish;

function spawn(now,el){
  const k=kk(el),d=DIF[G.dif],f=G.cam?1.15:1;
  const ttl=Math.max(800,(1500-500*k)*d.ttl*f);
  const defense=G.mode==='def'||(G.mode==='assess'&&Math.random()<.35);
  if(defense){
    const s=G.bh(),n=G.cam?cam.sm[0]:null;
    if(G.cam&&!n){G.next=now+300;return}
    const o={s,born:now,ttl:Math.max(1000,(1900-700*k)*d.ttl*f)};
    if(G.cam){
      const sw=swPx();o.sw=sw;o.n0={x:n.x,y:n.y};
      if(s==='F'){o.px=n.x;o.py=n.y}else if(s==='C'){const c=chestPt(sw);o.px=c.x;o.py=c.y}
    }
    G.th.push(o);G.busy=true;G.kind='d';return;
  }
  const r=Math.max(34,Math.min(W*.11,58)),[y0,y1]=yRange(r),nose=G.cam?cam.sm[0]:null,sw=G.cam?swPx():0,made=[];
  let at=now;
  for(let j=0;j<d.w;j++){
    if(j)at+=600+Math.random()*300;
    const [hand,kind]=G.bt().split(':'),tp=kind==='jab'?'jab':kind==='up'?'up':'cross';
    let px,py,ok=false;
    for(let i=0;i<20&&!ok;i++){
      px=hand==='R'?W*.46+Math.random()*(W*.54-r-8):r+8+Math.random()*(W*.54-r-8);
      py=y0+Math.random()*(y1-y0);
      ok=made.every(t=>Math.hypot(t.x-px,t.y-py)>r*2.4)
        &&(!nose||Math.hypot(nose.x-px,nose.y-py)>sw*.4+r*1.3)
        &&(!G.cam||['R','L'].every(h=>!cam.hp[h]||Math.hypot(cam.hp[h].x-px,cam.hp[h].y-py)>r*2.2));
    }
    if(ok)made.push({x:px,y:py,r,hand,tp,d:kind,born:at,ttl});
  }
  if(!made.length){G.next=now+300;return}
  G.tg.push(...made);G.busy=true;G.kind='p';
}
function kk(el){return G.mode==='assess'?Math.min(1,.5+el/60000):Math.min(el/90000,1)}
function yRange(r){
  let a=H*.16,b=H*.5;
  if(G.cam&&cam){const l=cam.sm[11],q=cam.sm[12];if(l&&q){const sw=swPx(),my=(l.y+q.y)/2;a=Math.max(SAT+80,my-sw*.9);b=Math.min(H*.6,my+sw)}}
  if(b-a<r*2)b=a+r*2;
  return[a,b];
}

function fx(px,py,txt,c,now){G.fx.push({x:px,y:py,txt,c,t:now})}
function good(px,py,txt,c,now,rt){
  G.hit++;G.combo++;G.best=Math.max(G.best,G.combo);G.score+=10+Math.min(G.combo,10)*2;G.rt.push(rt);
  fx(px,py,txt,c,now);if(navigator.vibrate)navigator.vibrate(12);
}
function fail(px,py,txt,now){
  G.miss++;G.combo=0;if(G.mode!=='assess')G.lives--;
  G.fl={u:now+200,c:'255,59,74'};fx(px,py,txt,'#ff3b4a',now);
}

// ввод касаниями (запасной вариант без камеры)
const ptr={};
cv.addEventListener('pointerdown',e=>{
  if(!G)return;e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  ptr[e.pointerId]={x:e.clientX,y:e.clientY,tg:G.tg.find(t=>performance.now()>=t.born&&Math.hypot(t.x-e.clientX,t.y-e.clientY)<t.r*1.4)||null};
});
cv.addEventListener('pointerup',e=>{
  const p=ptr[e.pointerId];delete ptr[e.pointerId];if(!G||!p||G.cam)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  const a=Math.hypot(dx,dy)<24?'tap':Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d');
  act(p,a,performance.now());
});
cv.addEventListener('pointercancel',e=>{delete ptr[e.pointerId]});
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

function act(p,a,now){
  const t=p.tg;
  if(t&&G.tg.includes(t)){
    const need=t.tp==='jab'?'tap':t.tp==='up'?'u':t.d;
    G.tg.splice(G.tg.indexOf(t),1);
    if(a===need){G['h'+t.hand]++;good(t.x,t.y,'ХИТ!',COL[t.hand],now,now-t.born)}
    else{G.wrong++;fail(t.x,t.y,'НЕ ТОТ УДАР',now)}
  }else{
    const h=G.th[0];
    if(h&&'LRD'.includes(h.s)&&a!=='tap'){
      const need=h.s==='L'?'r':h.s==='R'?'l':'d';
      if(a===need){G.th.shift();good(W/2,H/2,'УКЛОН!','#3ddc84',now,now-h.born)}
      else{G.wrong++;fx(W/2,H*.7,'НЕ В ТУ СТОРОНУ','#ffb020',now)}
    }
  }
}

function tick(now,id){
  if(id!==runId||!G)return;
  const el=G.ready?now-G.t0:0;
  if(G.mode==='assess'&&el>=G.end)return finish();
  if(G.cam&&cam)camDetect(now);
  if(G.busy&&!G.tg.length&&!G.th.length){
    G.busy=false;
    G.next=now+(G.kind==='d'?700+Math.random()*350:1000+Math.random()*500)*DIF[G.dif].gap*(1-.3*kk(el));
  }
  if(!G.busy&&now>=G.next)spawn(now,el);
  for(const t of G.tg.slice())if(now-t.born>t.ttl){G.tg.splice(G.tg.indexOf(t),1);fail(t.x,t.y,'ПРОМАХ',now)}
  const h=G.th[0];
  if(h&&now-h.born>h.ttl){G.th.shift();fail(W/2,H/2,'ПОПАДАНИЕ!',now)}
  if(G.mode!=='assess'&&G.lives<=0)return finish();
  draw(now,el);
  requestAnimationFrame(t=>tick(t,id));
}

function drawBody(){
  const s=cam.sm;
  const seg=(a,b,c)=>{if(s[a]&&s[b]){x.strokeStyle=c;x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(s[a].x,s[a].y);x.lineTo(s[b].x,s[b].y);x.stroke()}};
  seg(11,12,'#fff');seg(12,14,COL.R);seg(14,16,COL.R);seg(16,20,COL.R);seg(11,13,COL.L);seg(13,15,COL.L);seg(15,19,COL.L);
  x.fillStyle='#fff';
  for(const i of [11,12,13,14]){if(s[i]){x.beginPath();x.arc(s[i].x,s[i].y,6,0,7);x.fill()}}
  if(s[0]){x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(s[0].x,s[0].y,swPx()*.3,0,7);x.stroke()}
  for(const h of ['R','L']){const p=cam.hp[h];if(p){x.fillStyle=COL[h];x.beginPath();x.arc(p.x,p.y,14,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke()}}
}

function draw(now,el){
  x.fillStyle='#0b0d12';x.fillRect(0,0,W,H);
  if(G.cam&&cam&&cam.v.readyState>=2){
    const g=geo(),v=cam.v;
    x.save();x.translate(W,0);x.scale(-1,1);
    x.drawImage(v,g.ox,g.oy,v.videoWidth*g.s,v.videoHeight*g.s);
    x.restore();
    x.fillStyle='rgba(11,13,18,.45)';x.fillRect(0,0,W,H);
    drawBody();
  }
  x.textAlign='center';x.textBaseline='middle';
  if(G.cam&&(!G.ready||el<2200)){
    x.fillStyle='#fff';x.font='bold 22px system-ui,sans-serif';
    if(!G.ready){x.fillText('Встань так, чтобы были видны',W/2,H*.42);x.fillText('голова, плечи и обе руки',W/2,H*.47)}
    else{
      x.fillText('Приготовься',W/2,H*.45);
      x.font='bold 56px system-ui,sans-serif';
      x.fillText(Math.max(1,Math.ceil((2200-el)/700)),W/2,H*.55);
    }
  }
  if(!G.cam&&el<3000){
    x.fillStyle='#ffb020';x.font='bold 14px system-ui,sans-serif';
    x.fillText('Камера недоступна — касания и свайпы',W/2,H*.45);
  }

  for(const h of G.th){
    const f=Math.min(1,(now-h.born)/h.ttl);
    if(h.s==='F'||h.s==='C'){
      const rr=Math.max(26,h.sw*.3);
      x.strokeStyle='#ff3b4a';x.lineWidth=5;x.fillStyle='rgba(255,59,74,'+(.3+.4*f)+')';
      x.beginPath();x.arc(h.px,h.py,rr,0,7);x.fill();x.stroke();
      x.beginPath();x.arc(h.px,h.py,rr+8+40*(1-f),0,7);x.stroke();
      x.fillStyle='#fff';x.font='bold 22px system-ui,sans-serif';x.fillText('УВЕРНИСЬ!',h.px,h.py-rr-28);
      x.font='bold 12px system-ui,sans-serif';x.fillText(h.s==='F'?'УДАР В ЛИЦО':'УДАР В КОРПУС',h.px,h.py+rr+20);
      continue;
    }
    x.fillStyle='rgba(255,59,74,'+(.15+.35*f)+')';
    if(h.s==='L')x.fillRect(0,0,W/2,H);else if(h.s==='R')x.fillRect(W/2,0,W/2,H);else x.fillRect(0,0,W,H/2);
    const cx=h.s==='L'?W*.25:h.s==='R'?W*.75:W/2,cy=h.s==='D'?H*.25:H*.5;
    x.fillStyle='#fff';x.font='bold 18px system-ui,sans-serif';
    x.fillText(h.s==='L'?'АТАКА СЛЕВА':h.s==='R'?'АТАКА СПРАВА':'АТАКА СВЕРХУ',cx,cy-52);
    x.font='bold 64px system-ui,sans-serif';
    x.fillText(h.s==='L'?'→':h.s==='R'?'←':'↓',cx,cy);
    x.font='bold 16px system-ui,sans-serif';
    x.fillText(h.s==='D'?'НЫРОК':'УКЛОН',cx,cy+50);
    x.fillStyle='#fff';x.fillRect(cx-60,cy+72,120*(1-f),6);
  }

  for(const t of G.tg){
    if(now<t.born)continue;
    const f=Math.max(0,1-(now-t.born)/t.ttl),c=COL[t.hand];
    x.fillStyle=c+'33';x.strokeStyle=c;x.lineWidth=5;
    x.beginPath();x.arc(t.x,t.y,t.r,0,7);x.fill();x.stroke();
    x.strokeStyle='#fff';x.lineWidth=3;
    x.beginPath();x.arc(t.x,t.y,t.r+9,-Math.PI/2,-Math.PI/2+Math.PI*2*f);x.stroke();
    x.fillStyle='#fff';x.font='bold '+Math.round(t.r*.85)+'px system-ui,sans-serif';
    x.fillText(t.tp==='jab'?'●':t.tp==='up'?'↑':t.d==='l'?'←':'→',t.x,t.y+2);
    x.font='bold 12px system-ui,sans-serif';x.fillStyle=c;
    x.fillText(NAME[t.tp]+(t.hand==='R'?' · ПРАВАЯ':' · ЛЕВАЯ'),t.x,t.y+t.r+27);
  }

  G.fx=G.fx.filter(o=>now-o.t<600);
  for(const o of G.fx){
    const a=(now-o.t)/600;
    x.globalAlpha=1-a;x.strokeStyle=o.c;x.lineWidth=4;
    x.beginPath();x.arc(o.x,o.y,30+a*60,0,7);x.stroke();
    x.fillStyle=o.c;x.font='bold 20px system-ui,sans-serif';x.fillText(o.txt,o.x,o.y-a*40);
    x.globalAlpha=1;
  }
  if(now<G.fl.u){x.fillStyle='rgba('+G.fl.c+',.18)';x.fillRect(0,0,W,H)}

  const top=SAT;
  x.textAlign='left';x.fillStyle='#fff';x.font='bold 18px system-ui,sans-serif';
  x.fillText('Очки '+G.score,14,26+top);
  x.fillStyle=G.combo>2?'#ffb020':'#8b93a5';x.font='bold 14px system-ui,sans-serif';
  x.fillText('Серия ×'+G.combo+' · '+DIF[G.dif].n,14,48+top);
  x.textAlign='center';x.fillStyle='#fff';x.font='bold 26px system-ui,sans-serif';
  if(G.mode!=='assess')x.fillText('❤'.repeat(Math.max(0,G.lives)),W/2,28+top);
  else{
    x.fillText(Math.max(0,Math.ceil((G.end-el)/1000))+' с',W/2,28+top);
    x.fillStyle='#2a3040';x.fillRect(0,0,W,4);x.fillStyle='#3ddc84';x.fillRect(0,0,W*Math.min(1,el/G.end),4);
  }
}

const NM={inf:'Бесконечный режим',assess:'Оценка навыков',def:'Тренировка уклонов'};
function result(g){
  const n=g.hit+g.miss,acc=n?g.hit/n:0;
  const avg=g.rt.length?g.rt.reduce((a,b)=>a+b,0)/g.rt.length:0;
  const rsc=g.rt.length?Math.max(0,Math.min(1,(1200-avg)/800)):0;
  const tot=g.hR+g.hL,bal=tot?1-Math.abs(g.hR-g.hL)/tot:0;
  const crd=n?bal*(1-g.wrong/n):0;
  let sc=0;
  if(g.mode==='assess')sc=10*(.4*rsc+.4*acc+.2*crd);
  if(g.mode==='def')sc=10*(.5*rsc+.5*acc);
  const cm=sc>=8.5?'Профи! Реакция как у чемпиона':sc>=7?'Отличный результат':sc>=5?'Хорошо, есть над чем работать':sc>=3?'Это была разминка':'Нужна практика — попробуй ещё';
  const cell=(v,l)=>'<div><b>'+v+'</b><i>'+l+'</i></div>';
  let head=g.mode==='inf'
    ?'<div class="grade">'+g.score+'</div><p>очков</p>'
    :'<div class="grade">'+sc.toFixed(1)+'<em>/10</em></div><p>'+cm+'</p>';
  let c=cell(Math.round(avg)+' мс','Реакция')+cell(Math.round(acc*100)+'%','Точность');
  if(g.mode==='assess')c+=cell(Math.round(crd*100)+'%','Координация');
  if(g.mode==='def')c+=cell(g.hit,'Уклонов')+cell(g.miss,'Пропущено ударов');
  else c+=cell(g.hit,'Попаданий')+cell(g.miss,'Промахов')+cell(n,'Всего мишеней')+cell(g.hR+' / '+g.hL,'Правая / левая')+cell(g.best,'Лучшая серия');
  $('res').innerHTML='<h1 style="font-size:24px">'+NM[g.mode]+'</h1><p>Сложность: '+DIF[g.dif].n+'</p>'+head+'<div class="grid">'+c+'</div>'
    +'<button class="pri" data-m="'+g.mode+'">Ещё раз</button><button data-menu="1">В меню</button>';
  bind();show('res');
}
</script>
